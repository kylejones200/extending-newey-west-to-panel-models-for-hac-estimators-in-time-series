[project]
name = "extending-newey-west-to-panel-models-for-hac-estimators-in-time-series"
version = "0.1.0"
description = "Companion code for Medium article: extending newey west to panel models for hac estimators in time series"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "linearmodels>=6.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "statsmodels>=0.14.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
